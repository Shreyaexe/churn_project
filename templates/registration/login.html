<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Log in — Churn Predictor</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 380px; margin: 60px auto; padding: 0 16px; }
    h1 { font-size: 1.4rem; }
    label { display: block; margin-top: 12px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 16px; }
    .err { color: #b00020; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Churn Predictor — Log in</h1>

  {% if form.errors %}
    <p class="err">Your username and password didn't match. Try again.</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <label for="id_username">Username</label>
    {{ form.username }}

    <label for="id_password">Password</label>
    {{ form.password }}

    <button type="submit">Log in</button>
  </form>
</body>
</html>
